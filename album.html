<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>시그널 포토 갤러리</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FSBT5ELEKN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

<style>
body{
  background:#0b0b0b;
  color:white;
  font-family: 'Rubik', 'Noto Sans KR', sans-serif;
  padding:0px;
  max-width:1000px;
  margin:auto;
}

.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 40px;
  background:rgba(20,20,20,0.8);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.05);
  position:sticky;
  top:0;
  z-index:1000;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.home-btn{
  font-size:18px;
  text-decoration:none;
  color:#d0d0d0;
  transition:0.2s;
}

.home-btn:hover{
  color:white;
  text-shadow: 0 0 6px rgba(122,162,255,0.8), 0 0 12px rgba(122,162,255,0.6);
}

.logo{
  font-size:18px;
  font-weight:600;
  letter-spacing:1px;
  color:white;
}

.nav-links{
  display:flex;
  gap:30px;
}

.nav-links a{
  color:#d0d0d0;
  text-decoration:none;
  font-size:15px;
  position:relative;
  transition:0.25s;
}

.nav-links a:hover{
  color:white;
}

.nav-links a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-6px;
  width:0%;
  height:2px;
  background:#7aa2ff;
  transition:0.3s;
}

.nav-links a:hover::after{
  width:100%;
}

.nav-links a.active{
  color:white;
  text-shadow:
    0 0 4px rgba(122,162,255,0.9),
    0 0 10px rgba(122,162,255,0.6),
    0 0 20px rgba(122,162,255,0.4);
}

.nav-links a.active::after{
  width:100%;
}

.gallery-container {
  padding: 40px 20px;
}

.gallery-header {
  text-align: center;
  margin-bottom: 40px;
}

.gallery-header h1 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
}

.gallery-header p {
  opacity: 0.6;
  font-size: 14px;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.gallery-item {
  background: #111;
  border: 1px solid #333;
  border-radius: 12px;
  overflow: hidden;
  transition: transform 0.2s ease, border-color 0.2s ease;
  cursor: pointer;
}

.gallery-item:hover {
  transform: translateY(-4px);
  border-color: #555;
}

.gallery-img-wrap {
  width: 100%;
  height: 200px;
  overflow: hidden;
  background: #1a1a1a;
}

.gallery-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.gallery-item:hover .gallery-img-wrap img {
  transform: scale(1.05);
}

.gallery-info {
  padding: 16px;
}

.gallery-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
  color: #fff;
}

.gallery-desc {
  font-size: 13px;
  opacity: 0.6;
}

/* 모달 스타일 */
.modal {
  display: none;
  position: fixed;
  z-index: 2000;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(5px);
  justify-content: center;
  align-items: center;
  padding: 20px;
  box-sizing: border-box;
}

.modal img {
  max-width: 90%;
  max-height: 85vh;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.modal-close {
  position: absolute;
  top: 30px;
  right: 40px;
  color: #fff;
  font-size: 36px;
  font-weight: bold;
  cursor: pointer;
  transition: opacity 0.2s;
}

.modal-close:hover {
  opacity: 0.7;
}

.footerText{
  margin-top:50px;
  margin-bottom:30px;
  text-align:center;
  opacity:0.5;
  font-size:13px;
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="logo-area">
    <a href="index.html" class="home-btn">⌂</a>
    <div class="logo"></div>
    <div class="nav-links">
      <a href="index.html">컬러 텍스트</a>
      <a href="album.html" class="active">포토 갤러리</a>
    </div>
  </div>
</nav>

<div class="gallery-container">
  <div class="gallery-header">
    <h1>시그널 포토 갤러리</h1>
    <p>다양한 순간들과 소중한 추억들을 모아둔 공간입니다.</p>
  </div>

  <div class="gallery-grid">
    <!-- 갤러리 아이템 1 -->
    <div class="gallery-item" onclick="openModal('banner1.jpg', '희망♥욕망', '두 분의 사랑을 응원합니다 ! ')">
      <div class="gallery-img-wrap">
        <img src="banner1.jpg" alt="갤러리 이미지1">
      </div>
      <div class="gallery-info">
        <div class="gallery-title">희망♥욕망</div>
        <div class="gallery-desc">두 분의 사랑을 응원합니다 ! </div>
      </div>
    </div>

    <!-- 갤러리 아이템 2 -->
    <div class="gallery-item" onclick="openModal('banner2.jpg', '부자가 될 테야', '당신의 바램을 응원합니다 ! ')">
      <div class="gallery-img-wrap">
        <img src="banner2.jpg" alt="갤러리 이미지2">

      <div class="gallery-info">
        <div class="gallery-title">부자가 될 테야</div>
        <div class="gallery-desc">당신의 바램을 응원합니다 ! </div>
      </div>
    </div>

    <!-- 갤러리 아이템 3 -->
    <div class="gallery-item" onclick="openModal('banner3.jpg', '사진 게시해 드립니다. ', '디스코드 yu.naaa DM 주세요 ! ')">
      <div class="gallery-img-wrap">
        <img src="banner3.jpg" alt="갤러리 이미지3">
      </div>
      <div class="gallery-info">
        <div class="gallery-title">사진 게시해 드립니다.</div>
        <div class="gallery-desc">디스코드 yu.naaa DM 주세요 ! </div>
      </div>
    </div>
  </div>
</div>

<!-- 이미지 확대 모달 -->
<div class="modal" id="imageModal" onclick="closeModal()">
  <span class="modal-close">&times;</span>
  <img id="modalImg" src="" alt="확대 이미지">
</div>

<footer class="footerText">
  배너 게시 및 텍스트 광고 게시 문의 <br>
  ⚙️Discord yu.naaa ┃ 💜시그널 유나·333
</footer>

<script>
function openModal(src, title, desc) {
  const modal = document.getElementById('imageModal');
  const modalImg = document.getElementById('modalImg');
  modalImg.src = src;
  modal.style.display = 'flex';
}

function closeModal() {
  document.getElementById('imageModal').style.display = 'none';
}
</script>

</body>
</html>
